    <script>
      (function () {
        var modeKey = 'site-mode';
        var legacyKey = 'site-palette';
        var themeKey = 'site-theme';
        var validThemes = ['auto', 'neon', 'autumn', 'winter', 'spring', 'summer'];
        var seasons = {
          autumn: { start: 922, end: 1221 },
          winter: { start: 1222, end: 319 },
          spring: { start: 320, end: 620 },
          summer: { start: 621, end: 921 },
        };
        var legacy = localStorage.getItem(legacyKey);
        if (legacy !== null) {
          localStorage.removeItem(legacyKey);
          var legacyMode = legacy.split('-').pop() || '';
          if ((legacyMode === 'light' || legacyMode === 'dark') && localStorage.getItem(modeKey) === null) {
            localStorage.setItem(modeKey, legacyMode);
          }
        }
        var mode = localStorage.getItem(modeKey);
        if (mode !== 'light' && mode !== 'dark') {
          if (mode !== null) localStorage.removeItem(modeKey);
          mode = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        var storedTheme = localStorage.getItem(themeKey);
        var theme = validThemes.indexOf(storedTheme) !== -1 ? storedTheme : 'auto';
        if (storedTheme !== null && theme === 'auto' && storedTheme !== 'auto') {
          localStorage.removeItem(themeKey);
        }
        var family = theme;
        if (family === 'auto') {
          var today = new Date();
          var monthDay = (today.getMonth() + 1) * 100 + today.getDate();
          family = 'neon';
          var names = Object.keys(seasons);
          for (var i = 0; i < names.length; i++) {
            var s = seasons[names[i]];
            var inSeason =
              s.start > s.end ? monthDay >= s.start || monthDay <= s.end : monthDay >= s.start && monthDay <= s.end;
            if (inSeason) {
              family = names[i];
              break;
            }
          }
        }
        document.documentElement.setAttribute('data-palette', family + '-' + mode);
      })();
    </script>
